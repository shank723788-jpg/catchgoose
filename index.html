<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词抓大鹅</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: Arial, sans-serif; background: #e8f4f8; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; user-select: none; min-height: 100vh; }
h1 { color: #2c3e50; margin: 0 0 5px 0; font-size: 20px; text-align: center; }
.top-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 600px; }
.level-info { font-size: 15px; font-weight: bold; color: #e67e22; }
.shake-btn { padding: 6px 14px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 20px; border: none; background: #e74c3c; color: white; box-shadow: 0 3px 5px rgba(0,0,0,0.2); transition: all 0.2s; }
.shake-btn:active { transform: scale(0.95); }
.shake-btn.quiz-mode { background: #9b59b6; }
.shake-count { font-size: 14px; font-weight: bold; color: #e74c3c; background: #ffeaa7; padding: 4px 10px; border-radius: 15px; }
.status { margin-bottom: 10px; font-size: 13px; font-weight: bold; color: #34495e; text-align: center; }
#game-area { position: relative; width: 100%; max-width: 600px; aspect-ratio: 3 / 2; background: #d1e9f0; border-radius: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); margin-bottom: 12px; overflow: hidden; transition: transform 0.1s; }
#game-area.shaking { animation: shakeAnim 0.5s ease; }
@keyframes shakeAnim {
    0% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-5px, 5px) rotate(-1deg); }
    40% { transform: translate(5px, -5px) rotate(1deg); }
    60% { transform: translate(-5px, -5px) rotate(-1deg); }
    80% { transform: translate(5px, 5px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
}
.card { position: absolute; width: 14%; aspect-ratio: 1 / 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 4px rgba(0,0,0,0.2); transition: all 0.2s ease; text-align: center; padding: 3px; z-index: 10; overflow: hidden; }
.card.en { background: #d6eaff; border: 2px solid #3498db; color: #2980b9; }
.card.zh { background: #ffeaa7; border: 2px solid #f39c12; color: #d35400; }
.card:active { transform: scale(0.95); }
.card.blocked { filter: brightness(0.75); cursor: not-allowed; }
#slot-area { display: flex; gap: 4px; background: #dcdde1; padding: 8px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 10px; width: 100%; max-width: 600px; justify-content: center; }
.slot { flex: 1; aspect-ratio: 1 / 1; max-width: 70px; background: #f5f6fa; border: 2px dashed #bdc3c7; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; transition: all 0.3s ease; padding: 2px; text-align: center; overflow: hidden; }
.slot.filled.en { border-style: solid; border-color: #3498db; background: #d6eaff; color: #2980b9; }
.slot.filled.zh { border-style: solid; border-color: #f39c12; background: #ffeaa7; color: #d35400; }
.slot.matched-anim { animation: popOut 0.4s ease forwards; }
@keyframes popOut { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.8; } 100% { transform: scale(0); opacity: 0; } }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; padding: 15px; }
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal { background: white; padding: 25px 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 90vw; }
.modal h2 { margin: 0 0 10px 0; font-size: 20px; }
.modal p { margin: 0 0 15px 0; font-size: 15px; }
.modal button { padding: 10px 20px; font-size: 15px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 3px; }
.modal button:active { background: #2980b9; }
.music-btn { position: fixed; top: 8px; right: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background: rgba(255,255,255,0.9); z-index: 1000; }

.quiz-modal { background: white; padding: 25px 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 90vw; width: 320px; }
.quiz-emoji { font-size: 60px; margin: 5px 0 15px 0; }
.quiz-input { padding: 12px; font-size: 16px; border: 2px solid #3498db; border-radius: 8px; width: 100%; text-align: center; margin-bottom: 12px; outline: none; }
.quiz-input:focus { border-color: #e67e22; box-shadow: 0 0 8px rgba(230,126,34,0.5); }
.quiz-btn { padding: 10px 18px; font-size: 14px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 3px; }
.quiz-btn:active { background: #219150; }
.quiz-feedback { margin-top: 12px; font-size: 13px; font-weight: bold; line-height: 1.4; }
</style>
</head>
<body>

<h1>🦢 单词抓大鹅</h1>
<div class="top-bar">
    <span class="level-info">第 <span id="current-level">1</span> 关</span>
    <button class="shake-btn" id="shake-btn">🔥 颠锅</button>
    <span class="shake-count">颠锅: <span id="shake-count">1</span> 次</span>
</div>
<div class="status">剩余: <span id="remaining-count">0</span> ｜ 凑齐3张相同意思的卡片即可消除</div>

<div id="game-area"></div>

<div id="slot-area">
    <div class="slot" id="slot-0"></div>
    <div class="slot" id="slot-1"></div>
    <div class="slot" id="slot-2"></div>
    <div class="slot" id="slot-3"></div>
    <div class="slot" id="slot-4"></div>
    <div class="slot" id="slot-5"></div>
    <div class="slot" id="slot-6"></div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2 id="modal-title">🎉 恭喜！</h2>
        <p id="modal-desc">你通关了！</p>
        <button id="modal-btn" onclick="handleModalBtn()">再玩一次</button>
    </div>
</div>

<div class="modal-overlay" id="quiz-modal">
    <div class="quiz-modal">
        <h2>📝 答题换颠锅</h2>
        <p style="font-size:14px;">这个图片的英文是什么？</p>
        <div class="quiz-emoji" id="quiz-emoji">🍎</div>
        <input type="text" class="quiz-input" id="quiz-input" placeholder="输入英文单词..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div>
            <button class="quiz-btn" onclick="checkQuiz()">提交答案</button>
            <button class="quiz-btn" style="background:#e74c3c;" onclick="closeQuiz()">放弃</button>
        </div>
        <div class="quiz-feedback" id="quiz-feedback"></div>
    </div>
</div>

<audio id="bgm" src="bgm.mp3" loop></audio>
<audio id="click-sound1" src="click1.mp3"></audio>
<audio id="click-sound2" src="click2.mp3"></audio>
<audio id="match-sound" src="match.mp3"></audio>
<audio id="fail-sound" src="fail.mp3"></audio>
<button class="music-btn" id="music-btn">▶️ 音乐</button>

<script>
var levelData = [
    [
        { en: "fruit", zh: "水果", emoji: "🍉" }, { en: "apple", zh: "苹果", emoji: "🍎" },
        { en: "banana", zh: "香蕉", emoji: "🍌" }, { en: "lemon", zh: "柠檬", emoji: "🍋" },
        { en: "melon", zh: "甜瓜", emoji: "🍈" }, { en: "mushroom", zh: "蘑菇", emoji: "🍄" },
        { en: "tomato", zh: "西红柿", emoji: "🍅" }, { en: "grape", zh: "葡萄", emoji: "🍇" }
    ],
    [
        { en: "strawberry", zh: "草莓", emoji: "🍓" }, { en: "mango", zh: "芒果", emoji: "🥭" },
        { en: "pear", zh: "梨", emoji: "🍐" }, { en: "vegetable", zh: "蔬菜", emoji: "🥬" },
        { en: "bean", zh: "豆", emoji: "🫘" }, { en: "potato", zh: "马铃薯", emoji: "🥔" },
        { en: "carrot", zh: "胡萝卜", emoji: "🥕" }, { en: "garlic", zh: "大蒜", emoji: "🧄" },
        { en: "pepper", zh: "甜椒", emoji: "🫑" }, { en: "chilli", zh: "辣椒", emoji: "🌶️" },
        { en: "onion", zh: "洋葱", emoji: "🧅" }
    ],
    [
        { en: "breakfast", zh: "早餐", emoji: "🍳" }, { en: "lunch", zh: "午餐", emoji: "🍱" },
        { en: "dinner", zh: "晚餐", emoji: "🍽️" }, { en: "meal", zh: "一顿饭", emoji: "🍚" },
        { en: "fast food", zh: "快餐", emoji: "🍔" }, { en: "main course", zh: "主菜", emoji: "🥘" },
        { en: "bread", zh: "面包", emoji: "🍞" }, { en: "toast", zh: "烤面包", emoji: "🍞" }
    ],
    [
        { en: "burger", zh: "汉堡包", emoji: "🍔" }, { en: "curry", zh: "咖喱", emoji: "🍛" },
        { en: "egg", zh: "鸡蛋", emoji: "🥚" }, { en: "omelette", zh: "煎蛋", emoji: "🍳" },
        { en: "fish", zh: "鱼", emoji: "🐟" }, { en: "pasta", zh: "意大利面", emoji: "🍝" },
        { en: "sausage", zh: "香肠", emoji: "🌭" }, { en: "steak", zh: "牛排", emoji: "🥩" }
    ],
    [
        { en: "chicken", zh: "鸡肉", emoji: "🍗" }, { en: "rice", zh: "米饭", emoji: "🍚" },
        { en: "cold cuts", zh: "冷盘肉片", emoji: "🥓" }, { en: "meat", zh: "肉", emoji: "🍖" },
        { en: "cereal", zh: "谷物", emoji: "🥣" }, { en: "pizza", zh: "披萨", emoji: "🍕" },
        { en: "sandwich", zh: "三明治", emoji: "🥪" }, { en: "salad", zh: "沙拉", emoji: "🥗" },
        { en: "oil", zh: "油", emoji: "🫗" }, { en: "salt", zh: "盐", emoji: "🧂" },
        { en: "sugar", zh: "食糖", emoji: "🍬" }, { en: "sauce", zh: "酱", emoji: "🥫" }
    ],
    [
        { en: "drink", zh: "饮料", emoji: "🥤" }, { en: "café", zh: "咖啡馆", emoji: "☕" },
        { en: "coffee", zh: "咖啡", emoji: "☕" }, { en: "cola", zh: "可乐", emoji: "🥤" },
        { en: "juice", zh: "果汁", emoji: "🧃" }, { en: "lemonade", zh: "柠檬水", emoji: "🍋" },
        { en: "milk", zh: "牛奶", emoji: "🥛" }, { en: "yogurt", zh: "酸奶", emoji: "🥛" },
        { en: "tea", zh: "茶", emoji: "🍵" }, { en: "mineral water", zh: "矿泉水", emoji: "💧" }
    ]
];

var currentLevel = 0;
var shakeCount = 1;
var gameArea = document.getElementById('game-area');
var remainingCount = document.getElementById('remaining-count');
var currentLevelSpan = document.getElementById('current-level');
var shakeCountSpan = document.getElementById('shake-count');
var shakeBtn = document.getElementById('shake-btn');
var modal = document.getElementById('modal');
var modalTitle = document.getElementById('modal-title');
var modalDesc = document.getElementById('modal-desc');
var modalBtn = document.getElementById('modal-btn');

var quizModal = document.getElementById('quiz-modal');
var quizEmoji = document.getElementById('quiz-emoji');
var quizInput = document.getElementById('quiz-input');
var quizFeedback = document.getElementById('quiz-feedback');
var currentQuizWord = null;

var bgm = document.getElementById('bgm');
var clickSound1 = document.getElementById('click-sound1');
var clickSound2 = document.getElementById('click-sound2');
var matchSound = document.getElementById('match-sound');
var failSound = document.getElementById('fail-sound');
var musicBtn = document.getElementById('music-btn');

var cardsOnBoard = [];
var slotItems = [];
var isProcessing = false;

function playSound(audioEl) {
    if (audioEl) {
        audioEl.currentTime = 0;
        audioEl.play().catch(function(e) { });
    }
}

function playClickSound() {
    var sounds = [clickSound1, clickSound2];
    var randomSound = sounds[Math.floor(Math.random() * sounds.length)];
    playSound(randomSound);
}

function updateShakeButton() {
    shakeCountSpan.textContent = shakeCount;
    if (shakeCount > 0) {
        shakeBtn.textContent = '🔥 颠锅';
        shakeBtn.classList.remove('quiz-mode');
    } else {
        shakeBtn.textContent = '📝 答题换颠锅';
        shakeBtn.classList.add('quiz-mode');
    }
}

function initLevel(levelIndex) {
    if (levelIndex >= levelData.length) levelIndex = 0;
    currentLevel = levelIndex;
    currentLevelSpan.textContent = currentLevel + 1;
    shakeCount = currentLevel + 1;
    updateShakeButton();

    gameArea.innerHTML = '';
    document.querySelectorAll('.slot').forEach(function(s) {
        s.className = 'slot';
        s.textContent = '';
    });
    modal.classList.remove('show');
    cardsOnBoard = [];
    slotItems = [];
    isProcessing = false;

    var words = levelData[currentLevel];
    var deck = [];

    words.forEach(function(item) {
        var isEnMore = Math.random() > 0.5;
        if (isEnMore) {
            deck.push({ en: item.en, type: 'en', text: item.en });
            deck.push({ en: item.en, type: 'en', text: item.en });
            deck.push({ en: item.en, type: 'zh', text: item.zh });
        } else {
            deck.push({ en: item.en, type: 'en', text: item.en });
            deck.push({ en: item.en, type: 'zh', text: item.zh });
            deck.push({ en: item.en, type: 'zh', text: item.zh });
        }
    });

    for (var i = deck.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = deck[i]; deck[i] = deck[j]; deck[j] = temp;
    }

    remainingCount.textContent = deck.length;
    var areaWidth = gameArea.clientWidth;
    var areaHeight = gameArea.clientHeight;

    deck.forEach(function(cardData, index) {
        var card = document.createElement('div');
        card.className = 'card ' + cardData.type;
        card.textContent = cardData.text;
        card.setAttribute('data-en', cardData.en);
        card.setAttribute('data-id', index);
        card.setAttribute('data-in-slot', 'false');

        var x = Math.random() * (areaWidth * 0.85);
        var y = Math.random() * (areaHeight * 0.85);
        card.style.left = x + 'px';
        card.style.top = y + 'px';
        card.style.zIndex = index + 10;

        var rotate = (Math.random() - 0.5) * 20;
        card.style.transform = 'rotate(' + rotate + 'deg)';

        card.onclick = function() { handleCardClick(this); };
        gameArea.appendChild(card);
        cardsOnBoard.push(card);
    });

    updateBlockedStatus();
}

function updateBlockedStatus() {
    cardsOnBoard.forEach(function(card) {
        if (card.getAttribute('data-in-slot') === 'true') return;
        var rect = card.getBoundingClientRect();
        var isBlocked = false;

        cardsOnBoard.forEach(function(otherCard) {
            if (otherCard === card || otherCard.getAttribute('data-in-slot') === 'true') return;
            var otherRect = otherCard.getBoundingClientRect();
            var otherZ = parseInt(otherCard.style.zIndex) || 0;
            var thisZ = parseInt(card.style.zIndex) || 0;

            if (otherZ > thisZ) {
                var overlapX = Math.max(0, Math.min(rect.right, otherRect.right) - Math.max(rect.left, otherRect.left));
                var overlapY = Math.max(0, Math.min(rect.bottom, otherRect.bottom) - Math.max(rect.top, otherRect.top));
                if (overlapX * overlapY > rect.width * rect.height * 0.3) { isBlocked = true; }
            }
        });

        if (isBlocked) card.classList.add('blocked');
        else card.classList.remove('blocked');
    });
}

function handleCardClick(card) {
    if (isProcessing) return;
    if (card.getAttribute('data-in-slot') === 'true') return;
    if (card.classList.contains('blocked')) return;
    if (slotItems.length >= 7) return;

    playClickSound();

    isProcessing = true;
    var en = card.getAttribute('data-en');
    var type = card.classList.contains('en') ? 'en' : 'zh';
    var text = card.textContent;

    card.style.transform = 'scale(0.5)';
    card.style.opacity = '0';

    setTimeout(function() {
        card.setAttribute('data-in-slot', 'true');
        card.style.display = 'none';

        slotItems.push({ en: en, type: type, text: text, sourceCard: card });
        renderSlots();
        checkMatch();

        var remaining = cardsOnBoard.filter(function(c) {
            return c.getAttribute('data-in-slot') !== 'true';
        }).length;
        remainingCount.textContent = remaining;

        updateBlockedStatus();
        isProcessing = false;

        if (remaining === 0) {
            setTimeout(function() {
                if (currentLevel < levelData.length - 1) {
                    showModal('🎉 通关啦！', '恭喜你通过了第 ' + (currentLevel + 1) + ' 关！', '进入下一关');
                } else {
                    showModal('🏆 全部通关！', '太厉害了！你完成了所有关卡！', '再玩一次');
                }
            }, 500);
        }
    }, 300);
}

function renderSlots() {
    var slots = document.querySelectorAll('.slot');
    slots.forEach(function(slot, index) {
        slot.className = 'slot';
        slot.textContent = '';
        if (index < slotItems.length) {
            var item = slotItems[index];
            slot.classList.add('filled', item.type);
            slot.textContent = item.text;
        }
    });
}

function checkMatch() {
    var counts = {};
    slotItems.forEach(function(item, index) {
        if (!counts[item.en]) counts[item.en] = [];
        counts[item.en].push(index);
    });

    var matchedWord = null;
    for (var en in counts) {
        if (counts[en].length >= 3) { matchedWord = en; break; }
    }

    if (matchedWord) {
        playSound(matchSound);

        var indicesToRemove = counts[matchedWord].slice(0, 3);
        var slots = document.querySelectorAll('.slot');
        indicesToRemove.forEach(function(idx) {
            slots[idx].classList.add('matched-anim');
        });

        setTimeout(function() {
            indicesToRemove.sort(function(a, b) { return b - a; });
            indicesToRemove.forEach(function(idx) {
                slotItems.splice(idx, 1);
            });
            renderSlots();
            if (slotItems.length >= 7) {
                playSound(failSound);
                showModal('😢 挑战失败', '槽位满了，大鹅跑掉了！', '重新开始本关');
            }
        }, 400);
    } else {
        if (slotItems.length >= 7) {
            playSound(failSound);
            showModal('😢 挑战失败', '槽位满了，大鹅跑掉了！', '重新开始本关');
        }
    }
}

function showModal(title, desc, btnText) {
    modalTitle.textContent = title;
    modalDesc.textContent = desc;
    modalBtn.textContent = btnText;
    modal.classList.add('show');
}

function handleModalBtn() {
    modal.classList.remove('show');
    if (modalBtn.textContent === '进入下一关') {
        initLevel(currentLevel + 1);
    } else if (modalBtn.textContent === '再玩一次') {
        initLevel(0);
    } else {
        initLevel(currentLevel);
    }
}

function shakeCards() {
    if (isProcessing) return;
    gameArea.classList.add('shaking');
    playClickSound();

    var areaWidth = gameArea.clientWidth;
    var areaHeight = gameArea.clientHeight;

    cardsOnBoard.forEach(function(card) {
        if (card.getAttribute('data-in-slot') === 'true') return;

        var x = Math.random() * (areaWidth * 0.85);
        var y = Math.random() * (areaHeight * 0.85);
        card.style.left = x + 'px';
        card.style.top = y + 'px';

        var rotate = (Math.random() - 0.5) * 20;
        card.style.transform = 'rotate(' + rotate + 'deg)';

        card.style.zIndex = Math.floor(Math.random() * 100) + 10;
    });

    setTimeout(function() { updateBlockedStatus(); }, 100);
    setTimeout(function() { gameArea.classList.remove('shaking'); }, 500);
}

shakeBtn.onclick = function() {
    if (isProcessing) return;
    if (shakeCount > 0) {
        shakeCount--;
        updateShakeButton();
        shakeCards();
    } else {
        openQuiz();
    }
};

function openQuiz() {
    var words = levelData[currentLevel];
    var randomIndex = Math.floor(Math.random() * words.length);
    currentQuizWord = words[randomIndex];

    quizEmoji.textContent = currentQuizWord.emoji;
    quizInput.value = '';
    quizFeedback.textContent = '';
    quizModal.classList.add('show');
    setTimeout(function() { quizInput.focus(); }, 100);
}

function closeQuiz() {
    quizModal.classList.remove('show');
}

function checkQuiz() {
    var userAnswer = quizInput.value.trim().toLowerCase();
    var correctAnswer = currentQuizWord.en.toLowerCase();

    if (userAnswer === correctAnswer) {
        quizFeedback.textContent = '✅ 答对了！获得 1 次颠锅机会！';
        quizFeedback.style.color = '#27ae60';
        playSound(matchSound);

        setTimeout(function() {
            shakeCount++;
            updateShakeButton();
            quizModal.classList.remove('show');
        }, 800);
    } else {
        quizFeedback.textContent = '❌ 答错了，正确是 "' + currentQuizWord.en + '"，牌堆里加了几张卡片！';
        quizFeedback.style.color = '#e74c3c';
        playSound(failSound);

        addExtraCards(currentQuizWord);

        setTimeout(function() {
            quizModal.classList.remove('show');
        }, 1500);
    }
}

function addExtraCards(wordItem) {
    var areaWidth = gameArea.clientWidth;
    var areaHeight = gameArea.clientHeight;

    var newCards = [
        { en: wordItem.en, type: 'en', text: wordItem.en },
        { en: wordItem.en, type: 'zh', text: wordItem.zh },
        { en: wordItem.en, type: 'zh', text: wordItem.zh }
    ];

    newCards.forEach(function(cardData) {
        var card = document.createElement('div');
        card.className = 'card ' + cardData.type;
        card.textContent = cardData.text;
        card.setAttribute('data-en', cardData.en);
        card.setAttribute('data-in-slot', 'false');

        var x = Math.random() * (areaWidth * 0.85);
        var y = Math.random() * (areaHeight * 0.85);
        card.style.left = x + 'px';
        card.style.top = y + 'px';
        card.style.zIndex = Math.floor(Math.random() * 100) + 10;

        var rotate = (Math.random() - 0.5) * 20;
        card.style.transform = 'rotate(' + rotate + 'deg)';

        card.onclick = function() { handleCardClick(this); };
        gameArea.appendChild(card);
        cardsOnBoard.push(card);
    });

    var remaining = cardsOnBoard.filter(function(c) {
        return c.getAttribute('data-in-slot') !== 'true';
    }).length;
    remainingCount.textContent = remaining;

    setTimeout(function() { updateBlockedStatus(); }, 100);
}

quizInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        checkQuiz();
    }
});

musicBtn.onclick = function() {
    if (bgm.paused) {
        bgm.play();
        musicBtn.textContent = '🎵 音乐';
    } else {
        bgm.pause();
        musicBtn.textContent = '▶️ 音乐';
    }
};

window.onload = function() {
    initLevel(0);
};
</script>
